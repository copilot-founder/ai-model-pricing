<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="40" height="50">
  <!-- Bottom coin -->
  <g>
    <ellipse cx="20" cy="42" rx="14" ry="5" fill="#b8860b"/>
    <rect x="6" y="39" width="28" height="3" fill="#daa520"/>
    <ellipse cx="20" cy="39" rx="14" ry="5" fill="#ffd700"/>
    <ellipse cx="20" cy="39" rx="10" ry="3.5" fill="none" stroke="#b8860b" stroke-width="0.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 -12;0 0" dur="0.4s" begin="0.2s" fill="freeze"/>
  </g>

  <!-- Middle coin -->
  <g>
    <ellipse cx="20" cy="32" rx="14" ry="5" fill="#b8860b"/>
    <rect x="6" y="29" width="28" height="3" fill="#daa520"/>
    <ellipse cx="20" cy="29" rx="14" ry="5" fill="#ffd700"/>
    <ellipse cx="20" cy="29" rx="10" ry="3.5" fill="none" stroke="#b8860b" stroke-width="0.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 -12;0 0" dur="0.4s" begin="0.6s" fill="freeze"/>
  </g>

  <!-- Top coin -->
  <g>
    <ellipse cx="20" cy="22" rx="14" ry="5" fill="#b8860b"/>
    <rect x="6" y="19" width="28" height="3" fill="#daa520"/>
    <ellipse cx="20" cy="19" rx="14" ry="5" fill="#ffd700"/>
    <ellipse cx="20" cy="19" rx="10" ry="3.5" fill="none" stroke="#b8860b" stroke-width="0.5"/>
    <text x="20" y="21.5" text-anchor="middle" font-size="7" font-weight="bold" fill="#b8860b" font-family="Arial">$</text>
    <animateTransform attributeName="transform" type="translate" values="0 -12;0 0" dur="0.4s" begin="1s" fill="freeze"/>
  </g>

  <!-- Shine effect -->
  <ellipse cx="15" cy="17" rx="3" ry="1.5" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </ellipse>
</svg>
